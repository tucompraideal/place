<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda / Bot de Pedidos</title>
    <link rel="stylesheet" href="style.css"> <!-- O tus estilos actuales -->
</head>
<body>
    <div class="container">
        <h1>Nuestros Productos</h1>
        
        <!-- Catálogo de productos -->
        <div id="productos-container" class="grid-productos">
            <!-- Los productos se cargan dinámicamente desde app.js -->
        </div>

        <!-- Sección del Carrito -->
        <div class="carrito-section">
            <h2>Tu Carrito</h2>
            <ul id="lista-carrito">
                <!-- Ítems agregados -->
            </ul>
            <p><strong>Total: $<span id="total-carrito">0</span></strong></p>
            <div id="mensaje-envio" class="alerta-envio"></div>
            <button id="btn-procesar" disabled>Realizar Pedido</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
