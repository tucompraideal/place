<!DOCTYPE
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Catálogo Rápido</title>
    <style>
        /* Estilos generales */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #2c3e50;
        }

        /* Contenedor del catálogo en cuadrícula */
        .catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        /* Tarjeta de producto */
        .producto {
            background: #ffffff;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.2s;
        }

        .producto:hover {
            transform: translateY(-5px);
        }

        .producto img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 6px;
            background-color: #ddd;
        }

        .producto h3 {
            font-size: 1.1rem;
            margin: 10px 0 5px;
        }

        .precio {
            color: #e74c3c;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .btn-comprar {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            width: 100%;
        }

        .btn-comprar:hover {
            background-color: #219653;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mi Tienda Online</h1>
        <p>Prueba rápida de catálogo de productos</p>
    </header>

    <div class="catalogo">
        <!-- Producto 1 -->
        <div class="producto">
            <img src="https://picsum.photos/id/1060/300/200" alt="Producto 1">
            <h3>Cafetera Moderna</h3>
            <div class="precio">$45.00 USD</div>
            <button class="btn-comprar">Comprar</button>
        </div>

        <!-- Producto 2 -->
        <div class="producto">
            <img src="https://picsum.photos/id/103/300/200" alt="Producto 2">
            <h3>Cámara Vintage</h3>
            <div class="precio">$120.00 USD</div>
            <button class="btn-comprar">Comprar</button>
        </div>

        <!-- Producto 3 -->
        <div class="producto">
            <img src="https://picsum.photos/id/119/300/200" alt="Producto 3">
            <h3>Reloj Minimalista</h3>
            <div class="precio">$25.00 USD</div>
            <button class="btn-comprar">Comprar</button>
        </div>
    </div>

</body>
</html>
